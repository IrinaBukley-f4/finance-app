<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Финансы</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
  <div class="max-w-2xl mx-auto space-y-6">
    <div class="flex items-center justify-between">
      <h1 class="text-2xl font-bold text-gray-800">Финансовый дашборд</h1>
      <div id="rates" class="text-sm text-gray-500 text-right">Загрузка...</div>
    </div>

    <div id="error-box" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded"></div>

    <div class="bg-white rounded-lg shadow p-4">
      <h2 class="text-lg font-semibold text-gray-700 mb-2">Источник №1</h2>
      <div id="source1-address" class="hidden text-sm text-gray-500 mb-3"></div>
      <table class="w-full text-sm text-gray-600">
        <thead>
          <tr class="text-left text-gray-500 border-b border-gray-200">
            <th class="py-2 pr-2">Тип</th>
            <th class="py-2 pr-2">Сумма</th>
            <th class="py-2">Валюта</th>
          </tr>
        </thead>
        <tbody id="source1-body"></tbody>
      </table>
    </div>

    <div class="bg-white rounded-lg shadow p-4">
      <h2 class="text-lg font-semibold text-gray-700 mb-2">Источник №2</h2>
      <ul id="source2" class="flex flex-wrap gap-2"></ul>
    </div>

    <div class="bg-white rounded-lg shadow p-4">
      <h2 class="text-lg font-semibold text-gray-700 mb-2">Суммы по валютам</h2>
      <div id="totals" class="space-y-1 text-gray-600"></div>
    </div>

  </div>

  <script type="module" src="src/script.js"></script>
</body>
</html>
